{
  "target": "linux/amd64",
  "http": "127.0.0.1:56742",
  "procs": 1,
  "sandbox": "none",
  "enable_syscalls": [
    "openat", "mkdirat", "unlinkat", "renameat", "linkat", "symlinkat",
    "fallocate", "ftruncate", "fsync", "setxattr", "write", "close"
  ],
  "type": "qemu",
  "vm": {
    "count": 1,
    "cmdline": "root=/dev/vda rw net.ifnames=0 biosdevname=0",
    "image_device": "drive if=virtio,format=raw,file=",
    "qemu_args": "-machine q35,accel=tcg -cpu max",
    "network_device": "virtio-net-pci",
    "cpu": 2,
    "mem": 2048
  }
}
